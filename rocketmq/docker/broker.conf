# RocketMQ Broker 配置（本地学习环境）
# 用法：docker compose 启动时挂载到容器 /home/rocketmq/conf/broker.conf

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# 【关键】宿主机上的 Java 客户端走 docker 端口映射连 broker，
# broker 必须用"宿主机视角可达"的地址注册路由，否则客户端拿到容器内网 IP 会连不上。
# 客户端只跑在本机时 127.0.0.1 即可。
brokerIP1 = 127.0.0.1
listenPort = 10911

# 过期文件清理：凌晨 4 点删 48 小时前的 commitlog 文件
deleteWhen = 04
fileReservedTime = 48

# 刷盘策略：ASYNC_FLUSH（默认，性能高、宕机可能丢少量消息）
# 对比 SYNC_FLUSH：每条消息落盘才应答，可靠但吞吐骤降。
# 「消息不丢」实验里体会两者取舍即可，本地学习用异步刷盘。
flushDiskType = ASYNC_FLUSH

# 学习环境图省事：首次收发时自动创建 Topic / 订阅组（生产环境务必关掉，
# 改由运维审批建 Topic，防止 Topic 泛滥与权限失控）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 事务消息回查参数（实验六观察用，单位毫秒）：
# 半消息超过 transactionTimeOut 仍未收到二次确认 → 每 transactionCheckInterval 回查一次，
# 最多 transactionCheckMax 次，超限丢弃。默认 6s / 60s / 15 次，这里调快调少方便观察。
transactionTimeOut = 6000
transactionCheckInterval = 15000
transactionCheckMax = 5

server:
  port: 8081

spring:
  application:
    name: starter-test
  # RedissonClient 由 redisson-spring-boot-starter 依据这段配置创建；
  # 没有这段（或 Redis 连不上）则锁切面不装配，@DistributedLock 静默失效
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

# 分布式锁 starter 配置，前缀见 LockProperties
allblue:
  lock:
    enabled: true
    default-wait-time: 3000
    default-lease-time: -1        # -1 = 走 Redisson 看门狗自动续期
    key-namespace: starter-test   # key 命名空间，隔离不同应用
